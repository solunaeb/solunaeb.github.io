<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>널 사랑할고양</title>
  <meta name="theme-color" content="#1e1510">
  <meta name="description" content="느루와 함께 기다리는 21일">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="preload" href="./fonts/Galmuri11.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main id="stage" aria-label="느루의 방">
    <canvas id="room" width="384" height="216"></canvas>
  </main>

  <header id="hud" aria-live="off">
    <canvas id="clock" width="24" height="24" aria-hidden="true"></canvas>
    <div class="cd">
      <div class="cells">
        <div class="cell"><span class="lab">DAYS</span><span class="num" id="cd-d">00</span></div>
        <div class="cell"><span class="lab">HOURS</span><span class="num" id="cd-h">00</span></div>
        <div class="cell"><span class="lab">MINUTES</span><span class="num" id="cd-m">00</span></div>
        <div class="cell"><span class="lab">SECONDS</span><span class="num" id="cd-s">00</span></div>
        <div class="cell ms"><span class="lab">MS</span><span class="num" id="cd-ms">000</span></div>
      </div>
      <div class="until" id="cd-until">UNTIL NOV 19, 2026</div>
    </div>
  </header>

  <div id="mission" hidden>
    <span class="broom" aria-hidden="true"></span><span id="mission-text">방 청소 0/4</span>
  </div>

  <nav id="dock" aria-label="메뉴">
    <button class="pix-btn icon" id="btn-sound" aria-label="소리 끄기"><span class="ico ico-sound"></span></button>
    <button class="pix-btn icon" id="btn-settings" aria-label="설정과 도움말"><span class="ico ico-gear"></span></button>
    <button class="pix-btn icon" id="btn-test" aria-label="테스트 모드" hidden><span class="ico ico-bug"></span></button>
  </nav>

  <div id="player" hidden>
    <canvas id="player-disc" width="16" height="16" aria-hidden="true"></canvas>
    <div class="meta"><strong id="player-title">LP 1</strong><span id="player-song"></span></div>
    <button class="pix-btn small" id="player-stop">정지</button>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="banner" aria-live="polite"></div>
  <div id="testflag" hidden>TEST MODE</div>

  <div id="modal" hidden>
    <div class="backdrop" data-close></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <button class="pix-btn small close" data-close aria-label="닫기">✕</button>
      <div id="sheet-body"></div>
    </section>
  </div>

  <div id="start">
    <canvas id="door" width="96" height="96" aria-hidden="true"></canvas>
    <h1>널 사랑할고양</h1>
    <p>느루가 문 앞에서 기다리고 있어요</p>
    <button class="pix-btn big" id="enter">문 열고 들어가기</button>
    <small id="start-note"></small>
  </div>

  <div id="celebrate" hidden>
    <div class="cel-card">
      <p class="cel-top">2026. 11. 19</p>
      <h2>21일의 기다림, 끝!</h2>
      <div class="cel-letter" id="cel-letter"></div>
      <button class="pix-btn big" id="cel-close">방으로 돌아가기</button>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
